name: Website

# Builds Groot's website (website/build.py) and publishes it on GitHub Pages
# after every change to main. It can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Building can only read the code. Only the deploy job may publish, and only to Pages.
permissions:
  contents: read

# One publish at a time, and a newer one waits instead of cancelling a publish halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build the website
        # Uses only the standard library, so nothing needs installing
        run: python3 website/build.py _site

      - name: Upload the website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
